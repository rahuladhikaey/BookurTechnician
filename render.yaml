services:
  # ─── BOOKURTECHNICIAN TRUSTED NODE.JS BACKEND (RENDER FREE + FIREBASE SPARK) ───
  # Uses Cloud Firestore & Firebase Auth directly via Firebase Admin SDK.
  # MongoDB, PostgreSQL, Redis, and Kafka are NOT required or provisioned.
  - type: web
    name: bookurtechnician-backend
    runtime: node
    rootDir: functions
    plan: free
    region: singapore
    branch: main
    autoDeploy: false
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically (default 10000); app binds 0.0.0.0:$PORT
      - key: FIREBASE_PROJECT_ID
        value: bookmytechnician-53d94
      - key: FIREBASE_STORAGE_BUCKET
        value: bookmytechnician-53d94.firebasestorage.app
      # Paste full service account JSON (or base64) in Render Dashboard -> Environment
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      # Admin Portal credentials (must be set in Render Dashboard; never committed)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
      # EmailJS credentials must be entered securely in Render Dashboard (never committed)
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_ORIGIN
        value: https://bookmytechnician-53d94.web.app
      # Firebase Hosting domains (comma-separated)
      - key: CORS_ALLOWED_ORIGINS
        value: https://bookmytechnician-53d94.web.app,https://bookmytechnician-53d94.firebaseapp.com



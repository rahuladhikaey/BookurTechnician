services:
  # ─── 1. SPRING BOOT 3 API & WEBSOCKET CORE (api.bookurtechnician.online) ───
  - type: web
    name: bookurtechnician-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /actuator/health
    domains:
      - api.bookurtechnician.online
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: noreply@asaliswad.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false

  # ─── 2. REACT ADMIN PANEL (admin.bookurtechnician.online) ─────────────────
  - type: static
    name: bookurtechnician-admin
    buildCommand: cd apps/admin_panel && npm install && npm run build
    staticPublishPath: ./apps/admin_panel/dist
    branch: main
    autoDeploy: true
    domains:
      - admin.bookurtechnician.online
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.bookurtechnician.online/api/v1

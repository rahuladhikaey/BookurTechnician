services:
  # ─── 1. NODE.JS CORE API GATEWAY & SOCKET.IO BACKEND ─────────────────────────
  - type: web
    name: bookurtechnician-backend
    runtime: node
    rootDir: backend/node-core-service
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: bookurtechnician-db
          property: connectionString
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: noreply@asaliswad.com

  # ─── 2. REACT VITE ADMIN PANEL (STATIC SITE) ─────────────────────────────────
  - type: web
    name: bookurtechnician-admin
    runtime: static
    rootDir: apps/admin_panel
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bookurtechnician-backend.onrender.com/api/v1
      - key: VITE_API_URL
        value: https://bookurtechnician-backend.onrender.com/api/v1

databases:
  # ─── 3. FREE MANAGED POSTGRESQL DATABASE ─────────────────────────────────────
  - name: bookurtechnician-db
    databaseName: bookurtechnician
    user: bookurtechnician
    plan: free
    region: singapore

server:
  port: ${PORT:8080}

spring:
  application:
    name: bookurtechnician-compute-service
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:bookurtechnician_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

jwt:
  secret: ${JWT_SECRET:super_secret_jwt_key_bookurtechnician_2026_secure}

technician:
  search-radius-km: ${TECHNICIAN_SEARCH_RADIUS_KM:15}
  location-stale-seconds: ${TECHNICIAN_LOCATION_STALE_SECONDS:60}
  location-update-interval-seconds: ${LOCATION_UPDATE_INTERVAL_SECONDS:10}
  location-min-distance-meters: ${LOCATION_MIN_DISTANCE_METERS:50}
  dispatch-response-timeout-seconds: ${DISPATCH_RESPONSE_TIMEOUT_SECONDS:30}

server:
  port: ${PORT:8080}

spring:
  application:
    name: bookurtechnician-compute-service
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}}
    username: ${PG_USER:${SPRING_DATASOURCE_USERNAME:postgres.hgjvwddlwofzpdurvpzd}}
    password: ${PG_PASSWORD:${SPRING_DATASOURCE_PASSWORD:Rahul@2005@#}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

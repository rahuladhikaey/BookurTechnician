          lob:
            non_contextual_creation: true
  data:
    redis:
      url: ${REDIS_URL:${SPRING_DATA_REDIS_URL:rediss://default:gQAAAAAAAioGAAIgcDExMTk3NzY1MDdiYjE0MjRjYTAxN2JhOGE4NGNlMTBkZA@model-wahoo-141830.upstash.io:6379}}

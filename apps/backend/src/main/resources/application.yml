server:
  port: ${PORT:8080}

spring:
  application:
    name: bookurtechnician-compute-service
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:bookurtechnician_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
